name: Qualité de la plateforme
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r api/requirements.txt
      - run: python scripts/sync_artifacts.py --check
      - run: python -m unittest discover -s api/tests -v
      - run: python -m unittest discover -s n8n/evaluation -v
      - run: node --test n8n/tests/workflow.test.mjs frontend/tests/server.test.mjs
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
