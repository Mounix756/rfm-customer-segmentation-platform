name: rfm-assistant

services:
  frontend:
    build: ../frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3001"
    environment:
      RFM_API_URL: http://segmentation-api:8000
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/rfm-chat
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:?Définir SESSION_SECRET dans n8n/.env}
      COOKIE_SECURE: "false"
    depends_on:
      segmentation-api:
        condition: service_healthy
      n8n:
        condition: service_started
    init: true
    restart: unless-stopped

  segmentation-api:
    build: ../api
    ports:
      - "127.0.0.1:${RFM_API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rfm_memory
      POSTGRES_USER: rfm_memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans n8n/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfm_memory -d rfm_memory"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.36.7}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: Africa/Lome
      TZ: Africa/Lome
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      segmentation-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
